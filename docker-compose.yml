services:
  visionx-notifications-db:
    image: postgres:17-alpine
    container_name: visionx-notifications-postgres
    restart: unless-stopped
    env_file:
      - path: /opt/VisionX/secrets/.env.notifications
        required: false
      - path: ./.env
        required: false
      - path: ./.env.example
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-visionx_notifications}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - notifications_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-visionx_notifications}"]
      interval: 10s
      timeout: 5s
      retries: 5

  visionx-notifications-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionx-notifications-service
    restart: unless-stopped
    ports:
      - "${NOTIFICATIONS_PORT:-8010}:8080"
    depends_on:
      visionx-notifications-db:
        condition: service_healthy
    env_file:
      - path: /opt/VisionX/secrets/.env.notifications
        required: false
      - path: ./.env
        required: false
      - path: ./.env.example
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__NotificationsDatabase: Host=visionx-notifications-db;Port=5432;Database=${POSTGRES_DB:-visionx_notifications};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Issuer: ${JWT_ISSUER:-https://visionx.samstack.site/auth}
      Jwt__Audience: ${JWT_AUDIENCE:-visionx-app}
      Jwt__JwksUrl: ${JWT_JWKS_URL:-https://visionx.samstack.site/auth/.well-known/jwks.json}
      Jwt__PublicKeyPath: ${JWT_PUBLIC_KEY_PATH:-/run/secrets/jwt_public.pem}
      Jwt__PublicKeyPem: ${JWT_PUBLIC_KEY_PEM:-}
      Firebase__ProjectId: ${FIREBASE_PROJECT_ID:-visionx-notifications}
      Firebase__CredentialsPath: ${FIREBASE_CREDENTIALS_PATH:-/etc/firebase/service-account.json}
      Firebase__CredentialsJson: ${FIREBASE_CREDENTIALS_JSON:-}
      Webhook__Secret: ${SESSION_WEBHOOK_SECRET:-VisionX_SessionEvent_SharedSecret_2026}
      VisionXBackend__BaseUrl: ${VISIONX_BACKEND_URL:-https://visionx.samstack.site}
    volumes:
      - ./credentials:/etc/firebase:ro
      - ${JWT_SECRETS_DIR:-/opt/VisionX/secrets}:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  notifications_pgdata:
